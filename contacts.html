<main class="container">
<h2>Contact Us</h2>
<div class="card contact-card">
<form id="contactForm">
<input name="name" placeholder="Full name" required />
<input name="email" placeholder="Email" type="email" required />
<input name="subject" placeholder="Subject" />
<textarea name="message" placeholder="Message" rows="5" required></textarea>
<button class="btn primary" type="submit">Send Message</button>
</form>
<div class="contact-details">
<p><strong>Address:</strong> 123 Charity Lane</p>
<p><strong>Email:</strong> info@helpinghands.org</p>
<p><strong>Phone:</strong> +91 98765 43210</p>
</div>
</div>
<div id="contactMsg" class="small-msg"></div>
</main>


<footer class="site-footer"><div class="container"><p>© <span id="year"></span> Helping Hands</p></div></footer>
<script src="/assets/app.js"></script>
